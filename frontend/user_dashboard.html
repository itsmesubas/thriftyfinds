<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - ThriftyFinds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        
    .dashboard {
        padding: 100px 0 50px;
        background-color: #f8f9fa;
        min-height: 100vh;
    }

    .dashboard-header {
        background: linear-gradient(135deg, #ff6363 0%, #4D44DB 100%);
        color: white;
        padding: 30px 0;
        margin-bottom: 30px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: white;
        padding: 25px;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        text-align: center;
    }

    .stat-card i {
        font-size: 2.5rem;
        color: var(--primary-color);
        margin-bottom: 15px;
    }

    .stat-number {
        font-size: 2rem;
        font-weight: 700;
        color: var(--dark-color);
        margin: 10px 0;
    }

    .stat-label {
        color: var(--gray-color);
        font-size: 0.9rem;
    }

    .dashboard-tabs {
        background: white;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        overflow: hidden;
        margin-bottom: 30px;
    }

    .tab-headers {
        display: flex;
        background: #f8f9fa;
        border-bottom: 1px solid #ddd;
        flex-wrap: wrap;
    }

    .tab-header {
        padding: 15px 30px;
        cursor: pointer;
        border-bottom: 3px solid transparent;
        transition: var(--transition);
        font-weight: 500;
        flex: 1;
        min-width: 120px;
        text-align: center;
    }

    .tab-header.active {
        border-bottom-color: var(--primary-color);
        color: var(--primary-color);
        background: white;
    }

    .tab-content {
        display: none;
        padding: 30px;
    }

    .tab-content.active {
        display: block;
    }

    .orders-list {
        display: grid;
        gap: 20px;
    }

    .order-card {
        border: 1px solid #e0e0e0;
        border-radius: var(--border-radius);
        padding: 20px;
        background: white;
        width: 100%;
    }

    .order-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
        padding-bottom: 15px;
        border-bottom: 1px solid #f0f0f0;
        flex-wrap: wrap;
        gap: 10px;
    }

    .order-id {
        font-weight: 600;
        color: var(--dark-color);
        font-size: 1.1rem;
    }

    .order-date {
        color: var(--gray-color);
        font-size: 0.9rem;
        margin-top: 5px;
    }

    .order-status {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
        text-transform: capitalize;
        white-space: nowrap;
    }

    .status-pending { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #cce7ff; color: #004085; }
    .status-shipped { background: #d1edff; color: #0c5460; }
    .status-delivered { background: #d4edda; color: #155724; }
    .status-cancelled { background: #f8d7da; color: #721c24; }

    .order-items {
        margin-bottom: 15px;
    }

    .order-item {
        display: flex;
        gap: 15px;
        padding: 10px 0;
        border-bottom: 1px solid #f8f9fa;
        align-items: flex-start;
    }

    .order-item:last-child {
        border-bottom: none;
    }

    .item-image {
        width: 60px;
        height: 60px;
        object-fit: cover;
        border-radius: 8px;
        flex-shrink: 0;
    }

    .item-details {
        flex: 1;
        min-width: 0; /* Prevents text overflow */
    }

    .item-name {
        font-weight: 500;
        margin-bottom: 5px;
        word-wrap: break-word;
    }

    .item-price {
        color: var(--primary-color);
        font-weight: 600;
    }

    .item-quantity {
        color: var(--gray-color);
        font-size: 0.9rem;
    }

    .order-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-top: 15px;
        border-top: 1px solid #f0f0f0;
        flex-wrap: wrap;
        gap: 15px;
    }
    .btn1{
        padding: 10px 20px;
    background-color: var(--primary-color);
    color: white;
    border: none;
    border-radius: var(--border-radius);
    cursor: pointer;
    font-weight: 500;
    transition: var(--transition);
    font-size: 0.9rem;
    box-shadow: 0 5px 10px rgba(0, 0, 0, 0.77);
    }
.btn1:hover {
    background-color: var(--secondary-color);
    transform: translateY(-2px);
}
    .order-total {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--dark-color);
    }

    .order-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .btn-sm {
        padding: 8px 15px;
        font-size: 0.8rem;
        white-space: nowrap;
    }

    /* Address Cards - IMPROVED RESPONSIVE */
    .addresses-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        width: 100%;
    }

    .address-card {
        border: 1px solid #e0e0e0;
        border-radius: var(--border-radius);
        padding: 20px;
        background: white;
        position: relative;
        transition: all 0.3s ease;
        display: flex;
        flex-direction: column;
        height: fit-content;
    }

    .address-card.default {
        border-color: var(--primary-color);
        background: #f8f9ff;
        border-width: 2px;
    }

    .address-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .address-type {
        display: inline-block;
        padding: 4px 12px;
        background: var(--primary-color);
        color: white;
        border-radius: 12px;
        font-size: 0.7rem;
        margin-bottom: 10px;
        text-transform: capitalize;
        width: fit-content;
    }

    .address-default {
        position: absolute;
        top: 15px;
        right: 15px;
        background: var(--success-color);
        color: white;
        padding: 4px 10px;
        border-radius: 10px;
        font-size: 0.7rem;
        font-weight: 500;
    }

    .address-card h4 {
        margin: 5px 0 10px 0;
        color: var(--dark-color);
        font-size: 1.1rem;
    }

    .address-card p {
        margin: 4px 0;
        color: var(--gray-color);
        line-height: 1.4;
        word-wrap: break-word;
    }

    .address-actions {
        margin-top: auto;
        padding-top: 15px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }

    .address-actions .btn-sm {
        flex: 1;
        min-width: 80px;
        text-align: center;
        padding: 6px 10px;
        font-size: 0.75rem;
    }

    

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }

    
    .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--gray-color);
        width: 100%;
    }

    .empty-state i {
        font-size: 3rem;
        margin-bottom: 15px;
        color: #ddd;
    }

    
    /* Form Actions */
    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 25px;
        flex-wrap: wrap;
    }

    /* Address Modal Styles */
    #addAddressModal .modal-content {
        max-height: 90vh;
        overflow-y: auto;
        width: 95%;
        max-width: 600px;
    }

    /* Mobile Responsive Styles */
    @media (max-width: 1200px) {
        .addresses-grid {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
    }

    @media (max-width: 768px) {
        .dashboard {
            padding: 80px 0 30px;
        }

        .dashboard-header {
            padding: 20px 0;
            margin-bottom: 20px;
        }

        .stats-grid {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            padding: 20px 15px;
        }

        .stat-number {
            font-size: 1.5rem;
        }

        .tab-headers {
            flex-direction: column;
        }

        .tab-header {
            padding: 12px 20px;
            min-width: auto;
        }

        .tab-content {
            padding: 20px;
        }

        .form-row {
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .order-header {
            flex-direction: column;
            align-items: flex-start;
        }

        .order-footer {
            flex-direction: column;
            align-items: flex-start;
        }

        .order-actions {
            width: 100%;
            justify-content: space-between;
        }

        .order-actions .btn-sm {
            flex: 1;
            text-align: center;
        }

        /* Mobile Address Cards */
        .addresses-grid {
            grid-template-columns: 1fr;
            gap: 15px;
        }

        .address-card {
            padding: 15px;
        }

        .address-actions {
            flex-direction: column;
        }

        .address-actions .btn-sm {
            width: 100%;
            min-width: auto;
        }

       
        .form-actions {
            flex-direction: column;
        }

        .form-actions .btn {
            width: 100%;
        }

        /* Mobile Order Items */
        .order-item {
            flex-direction: column;
            text-align: center;
            gap: 10px;
        }

        .item-image {
            align-self: center;
        }
    }

    @media (max-width: 480px) {
        .container {
            width: 95%;
            padding: 0 10px;
        }

        .stats-grid {
            grid-template-columns: 1fr 1fr;
        }

        .tab-content {
            padding: 15px;
        }

        .addresses-grid {
            grid-template-columns: 1fr;
        }

        .checkbox-group {
            grid-template-columns: 1fr;
        }

        .order-actions {
            flex-direction: column;
        }

        .order-actions .btn-sm {
            width: 100%;
        }

        .address-card h4 {
            font-size: 1rem;
        }

        .address-card p {
            font-size: 0.9rem;
        }
    }

    @media (max-width: 360px) {
        .stats-grid {
            grid-template-columns: 1fr;
        }

        .order-card {
            padding: 15px;
        }

        .address-card {
            padding: 12px;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.7rem;
        }
    }

    /* Very Small Devices */
    @media (max-width: 320px) {
        .tab-header {
            padding: 10px 15px;
            font-size: 0.9rem;
        }

        .order-header {
            gap: 8px;
        }

        .address-actions .btn-sm {
            font-size: 0.7rem;
            padding: 5px 8px;
        }
    }

    /* Loading States */
    .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .fa-spinner {
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Text Overflow Prevention */
    .item-name,
    .address-card p,
    .order-id {
        overflow-wrap: break-word;
        word-wrap: break-word;
        hyphens: auto;
    }

    /* Ensure images don't overflow */
    .item-image,
    .product-thumbnail {
        max-width: 100%;
        height: auto;
    }

    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <a href="index.html"><i class="fas fa-recycle"></i> ThriftyFinds</a>
            </div>
            
            <nav class="navbar">
                <ul>
                    <li><a href="index.html?user_type=user">Home</a></li>
                    <li><a href="user_dashboard.html">My Account</a></li>
                    <li><a href="#orders">Orders</a></li>
                   
                </ul>
            </nav>
            
            <div class="auth-buttons">
                <span id="userEmailDisplay" style="margin-right: 15px; color: var(--primary-color);"></span>
                <button id="logoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
          
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- Dashboard Header -->
    <div class="dashboard-header">
        <div class="container">
            
            <h1>Account</h1>
            <p>Manage your orders, addresses, and account settings</p>
        </div>
    </div>

    <!-- Dashboard Content -->
    <section class="dashboard">
        <div class="container">
            <!-- Stats Overview -->
            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fas fa-shopping-bag"></i>
                    <div class="stat-number" id="totalOrders">0</div>
                    <div class="stat-label">Total Orders</div>
                </div>
                <div class="stat-card">
                    <i class="fas fa-truck"></i>
                    <div class="stat-number" id="pendingOrders">0</div>
                    <div class="stat-label">Pending Delivery</div>
                </div>
                
                <div class="stat-card">
                    <i class="fas fa-money-bill-wave"></i>
                    <div class="stat-number" id="totalSpent">Rs.0</div>
                    <div class="stat-label">Total Spent</div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="dashboard-tabs">
                <div class="tab-headers">
                    <div class="tab-header active" data-tab="orders">Orders</div>
                    
                   
                </div>

                <!-- Orders Tab -->
                <div class="tab-content active" id="orders-tab">
                    <h3>Order History</h3>
                    <div class="orders-list" id="ordersList">
                        <!-- Orders will be loaded here -->
                        <div class="empty-state">
                            <i class="fas fa-shopping-bag"></i>
                            <h3>No Orders Yet</h3>
                            <p>You haven't placed any orders yet.</p>
                            <p> . </p>

                            <a href="index.html" class="btn1">Start Shopping</a>
                        </div>
                    </div>
                </div>

        

     
        
     
             
            </div>
        </div>
    </section>

    <script src="user_dashboard.js"></script>
</body>
</html>
